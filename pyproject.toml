[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialmediaai"
version = "0.1.0"
description = "SocialMediaAi library — configuration and LLM providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35.0"]
vertex = ["google-auth>=2.35.0"]
dev = ["pytest>=8.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["socialmediaai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
